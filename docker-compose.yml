services:
  # Ingress Reverse Proxy (Port 80)
  # Routes:
  # - http://localhost -> Main Marketplace
  # - http://<store-slug>.localhost -> Individual Store Website (e.g. http://seoul-2.localhost)
  # - http://localhost/api/* -> Express API backend
  gateway:
    image: nginx:alpine
    container_name: khmercraft-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - khmercraft-net

  # Angular Web Frontend
  # Serves both the Main Marketplace and Storefront Domains dynamically
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: khmercraft-web
    restart: unless-stopped
    ports:
      - "4200:80"
    networks:
      - khmercraft-net

  # Express Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: khmercraft-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.docker
    networks:
      - khmercraft-net

  # Local MongoDB database (optional offline storage)
  mongo:
    image: mongo:7
    container_name: khmercraft-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - khmercraft-net

networks:
  khmercraft-net:
    driver: bridge

volumes:
  mongo_data:
