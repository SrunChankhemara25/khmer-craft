<!-- Authentication feature: buyer password recovery. -->
<app-auth-layout
  title="Reset your password"
  subtitle="Enter your buyer account email and we'll prepare a secure reset link."
>
  @if (sent()) {
    <div class="notice success" role="status">
      If a buyer account exists for that email, a reset link is on its way.
    </div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email address</span>
      <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>
    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Sending…' : 'Send reset link' }}
    </button>
  </form>
  <p class="auth-switch"><a routerLink="/login">← Back to sign in</a></p>
</app-auth-layout>
