<!-- Authentication feature: buyer login. -->
<app-auth-layout
  title="Welcome back"
  subtitle="Sign in to continue discovering authentic Cambodian craft."
>
  @if (success()) {
    <div class="notice success" role="status">{{ success() }}</div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Email address</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@example.com"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>

    <label>
      <span class="label-row">
        Password
        <a routerLink="/forgot-password">Forgot password?</a>
      </span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        placeholder="Enter your password"
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Password is required.</small>
      }
    </label>

    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="auth-switch">
    New to KhmerCraft? <a routerLink="/register">Create an account</a>
  </p>
  <a class="admin-link" routerLink="/admin/login">Administrator sign in</a>
</app-auth-layout>
