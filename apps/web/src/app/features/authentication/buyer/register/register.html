<app-auth-layout
  title="Create your account"
  subtitle="Join a marketplace built around meaningful objects and the people who make them."
>
  @if (success()) {
    <div class="notice success" role="status">{{ success() }}</div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <form class="auth-form compact" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>Full name<span class="required">*</span></span>
      <span class="input-icon-wrap">
        <ui-icon name="user" [size]="16"></ui-icon>
        <input formControlName="name" autocomplete="name" placeholder="Your full name" />
      </span>
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <small>Enter at least 2 characters.</small>
      }
    </label>

    <label>
      <span>Email address<span class="required">*</span></span>
      <span class="input-icon-wrap">
        <ui-icon name="mail" [size]="16"></ui-icon>
        <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
      </span>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>

    <label>
      <span>Phone <em>Optional</em></span>
      <span class="input-icon-wrap">
        <ui-icon name="phone" [size]="16"></ui-icon>
        <input type="tel" formControlName="phone" autocomplete="tel" placeholder="+855 12 345 678" />
      </span>
    </label>

    <label>
      <span>Password<span class="required">*</span></span>
      <div class="password-field">
        <span class="input-icon-wrap">
          <ui-icon name="lock" [size]="16"></ui-icon>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            placeholder="Create a strong password"
          />
        </span>
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
          [attr.title]="passwordVisible() ? 'Hide password' : 'Show password'"
        >
          <ui-icon [name]="passwordVisible() ? 'eye' : 'eye-off'" [size]="18" />
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Use 8+ characters with uppercase, lowercase and a number.</small>
      }
    </label>

    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Create buyer account' }}
    </button>
  </form>

  <p class="auth-switch">
    Already have an account? <a routerLink="/login">Sign in</a>
  </p>
</app-auth-layout>
