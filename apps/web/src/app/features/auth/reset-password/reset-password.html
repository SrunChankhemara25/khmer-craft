<app-auth-layout
  title="Choose a new password"
  subtitle="Create a strong password you haven't used for this account before."
>
  @if (!token) {
    <div class="notice error" role="alert">
      This reset link is incomplete. Request a new link to continue.
    </div>
    <p class="auth-switch"><a routerLink="/forgot-password">Request a new link</a></p>
  } @else if (complete()) {
    <div class="notice success" role="status">
      Your password has been reset. You can now sign in with the new password.
    </div>
    <a class="primary-button button-link" routerLink="/login">Continue to sign in</a>
  } @else {
    @if (error()) {
      <div class="notice error" role="alert">{{ error() }}</div>
    }
    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>
        <span>New password</span>
        <input type="password" formControlName="password" autocomplete="new-password" placeholder="Enter a new password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small>Use 8+ characters with uppercase, lowercase and a number.</small>
        }
      </label>
      <label>
        <span>Confirm password</span>
        <input type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="Repeat your new password" />
      </label>
      <button class="primary-button" type="submit" [disabled]="loading()">
        {{ loading() ? 'Updating…' : 'Reset password' }}
      </button>
    </form>
  }
</app-auth-layout>
