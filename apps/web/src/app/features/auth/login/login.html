<app-auth-layout
  [eyebrow]="content().eyebrow"
  [title]="content().title"
  [subtitle]="content().subtitle"
>
  @if (success()) {
    <div class="notice success" role="status">{{ success() }}</div>
  }
  @if (error()) {
    <div class="notice error" role="alert">{{ error() }}</div>
  }

  <!-- Single unified login page: tabs removed -->

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span>{{ content().emailLabel }}<span class="required">*</span></span>
      <span class="input-icon-wrap">
        <ui-icon name="mail" [size]="16"></ui-icon>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          [placeholder]="content().emailPlaceholder"
        />
      </span>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Enter a valid email address.</small>
      }
    </label>

    <label>
      <span class="label-row">
        <span> Password <span class="required">*</span></span>
        <a routerLink="/forgot-password">Forgot password?</a>
      </span>
      <div class="password-field">
        <span class="input-icon-wrap">
          <ui-icon name="lock" [size]="16"></ui-icon>
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Enter your password"
          />
        </span>
        <button
          type="button"
          class="password-toggle"
          (click)="togglePassword()"
          [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
          [attr.title]="passwordVisible() ? 'Hide password' : 'Show password'"
        >
          <ui-icon [name]="passwordVisible() ? 'eye' : 'eye-off'" [size]="18" />
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>Password is required.</small>
      }
    </label>

    <button class="primary-button" type="submit" [disabled]="loading()">
      {{ loading() ? content().busy : content().button }}
    </button>
  </form>

  <p class="auth-switch">
    New to KhmerCraft? <a routerLink="/register">Create a buyer account</a>
  </p>
</app-auth-layout>
