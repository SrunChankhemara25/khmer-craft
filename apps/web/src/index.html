<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KhmerCraft</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Tab icon: crisp SVG where supported, multi-size .ico as the fallback. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#8e3021">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- --font-body names Inter, but nothing ever loaded it, so every screen
       was silently falling back to the OS system font. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap" rel="stylesheet">
  <!-- Bold display face for promo poster headlines only — everywhere else keeps --font-heading/--font-body. -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <!-- Warm, crafted serif for the seller onboarding headlines. -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&amp;family=Noto+Sans+Khmer:wght@400;500;600;700&amp;family=Noto+Serif+Khmer:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</head>

</body>
</html>
