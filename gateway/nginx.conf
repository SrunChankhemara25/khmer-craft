events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Upstream services
    upstream api_backend {
        server api:3001;
    }

    upstream web_frontend {
        server web:80;
    }

    # Gateway Reverse Proxy
    # Handles:
    # 1. Main marketplace: localhost, khmercraft.local, khmercraft.com
    # 2. Store subdomains: *.localhost, *.khmercraft.local, *.khmercraft.com (e.g. seoul-2.localhost)
    server {
        listen 80;
        server_name localhost *.localhost khmercraft.local *.khmercraft.local _;

        # Client body limit for image uploads
        client_max_body_size 25M;

        # API routing
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 90s;
        }

        # Frontend SPA routing (Main Marketplace + Store Domains)
        location / {
            proxy_pass http://web_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
